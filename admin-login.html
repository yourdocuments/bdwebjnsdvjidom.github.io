<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebsitesDeal Admin Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08110c;color:#eef6ef;font-family:Inter,system-ui,sans-serif;padding:20px}.card{width:min(430px,100%);background:#101d15;border:1px solid #293c2e;border-radius:22px;padding:30px;box-shadow:0 24px 80px #0005}.logo{width:46px;height:46px;border-radius:14px;background:#b8f34a;color:#102018;display:grid;place-items:center;font-weight:950;font-size:20px}h1{font-size:25px;margin:22px 0 8px}p{color:#9aada0;font-size:13px;line-height:1.7}.field{margin:18px 0}.field label{display:block;font-size:12px;color:#9aada0;margin-bottom:8px}.field input{width:100%;padding:13px;border:1px solid #293c2e;border-radius:10px;background:#09140d;color:#eef6ef}.btn{width:100%;border:0;border-radius:10px;padding:14px;background:#b8f34a;color:#102018;font-weight:900;cursor:pointer}.warning{font-size:11px;color:#e7c47b;border:1px dashed #6c5930;border-radius:10px;padding:12px;margin-top:18px}.error{color:#ff7777;font-size:12px;min-height:18px}</style></head><body><form class="card" id="login"><div class="logo">W</div><h1>Admin sign in</h1><p>WebsitesDeal Studio — admin preview access</p><div class="field"><label>Demo username</label><input id="user" autocomplete="username" required placeholder="Enter username"></div><div class="field"><label>Demo password</label><input id="pass" type="password" autocomplete="current-password" required placeholder="Enter password"></div><div class="error" id="error"></div><button class="btn">Open Admin Studio</button><div class="warning">গুরুত্বপূর্ণ: এটি কেবল UI demo login। Static HTML-এ রাখা login production security নয়। এখানে কোনো default password রাখা হয়নি। Production ব্যবহারের আগে server-side authentication এবং protected database/API যুক্ত করুন।</div></form><script>document.getElementById('login').addEventListener('submit',e=>{e.preventDefault();document.getElementById('error').textContent='Demo login is not configured. Connect a real authentication provider before enabling admin access.'})</script></body></html>
